[project]
name = "ds-capstone"
version = "0.1.0"
description = "Data science capstone project"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy",
    "scikit-learn",
    "dash>=3.0.0",
    "plotly>=6.0.0",
    "scipy>=1.16",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=6.2", "torch>=2.15"]   # torch listed directly so the source below applies
# The same on an NVIDIA GPU (CUDA 13.0+ driver): torch from the CUDA index, 3 GB instead of 0.5 GB. Opt-in, and
# conflicting with `embeddings`, so every sync names one of the two.
embeddings-gpu = ["sentence-transformers>=6.2", "torch>=2.15"]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.uv]
package = false
conflicts = [[{ extra = "embeddings" }, { extra = "embeddings-gpu" }]]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "embeddings", marker = "sys_platform == 'linux'" },
  { index = "pytorch-cu132", extra = "embeddings-gpu", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true            # only torch comes from here; everything else stays on PyPI

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.ruff]
line-length = 100
# The app keeps its own style (its lines run past 100), so it is never linted or formatted.
extend-exclude = [".claude", "app", "models", "start.py", "tests", "evaluate.py"]

[tool.ruff.lint]
# E/W: style, F: likely bugs, I: import sorting, UP: modern syntax.
select = ["E", "W", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The repository's root on the import path: app, start and evaluate.
pythonpath = ["."]