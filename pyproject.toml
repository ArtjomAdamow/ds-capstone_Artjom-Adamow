[project]
name = "ds-capstone"
version = "0.1.0"
description = "Data science capstone project"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "joblib",
    "matplotlib",
    "numpy",
    "pandas",
    "scikit-learn",
    "seaborn",
    "dash>=3.0.0",
    "plotly>=6.0.0",
    "scipy>=1.16",
]

[project.optional-dependencies]
# The flashcards viewer: a separately licensed private package, see README "Third-party".
viewer = ["sputnik"]
embeddings = ["sentence-transformers>=6.2", "torch>=2.15"]   # torch listed directly so the source below applies
# The same on an NVIDIA GPU (CUDA 13.0+ driver): torch from the CUDA index, 3 GB instead of 0.5 GB. Opt-in, and
# conflicting with `embeddings`, so every sync names one of the two.
embeddings-gpu = ["sentence-transformers>=6.2", "torch>=2.15"]

[dependency-groups]
dev = [
    "ipykernel",
    "nbdime",
    "pytest",
    "ruff",
]

[tool.uv]
package = false
conflicts = [[{ extra = "embeddings" }, { extra = "embeddings-gpu" }]]

[tool.uv.sources]
sputnik = { git = "ssh://git@github.com/ArtjomAdamow/sputnik.git", tag = "v0.5.0" }
torch = [
  { index = "pytorch-cpu", extra = "embeddings", marker = "sys_platform == 'linux'" },
  { index = "pytorch-cu132", extra = "embeddings-gpu", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true            # only torch comes from here; everything else stays on PyPI

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.ruff]
line-length = 100
# The app's files come from the export workspace with every train and keep its style, so they are
# never linted or formatted here.
extend-exclude = [".claude", "app", "start.py", "tests/app", "evaluate.py"]

[tool.ruff.lint]
# E/W: style, F: likely bugs, I: import sorting, UP: modern syntax.
select = ["E", "W", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# Notebooks import the libraries you are about to use, so "unused import" is noise.
"*.ipynb" = ["F401", "E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Makes `from src...` work without installing the project as a package.
pythonpath = ["."]